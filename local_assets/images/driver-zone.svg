<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e9ee"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ced6"/><stop offset="1" stop-color="#aeb4be"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3340"/><stop offset="1" stop-color="#151a22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dx="18" dy="26"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="#ffffff"/>
  <g filter="url(#shadow)">
    <!-- right side edge for a slight angle -->
    <path d="M760 210 L800 240 L800 790 L760 820 Z" fill="url(#side)"/>
    <rect x="220" y="190" width="560" height="640" rx="70" fill="url(#body)" stroke="#d5dae1" stroke-width="4"/>
  </g>
  <rect x="290" y="270" width="420" height="300" rx="28" fill="url(#screen)"/>
  <text x="478" y="440" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="132" font-weight="300" fill="#ffffff">21.0</text>
  <text x="660" y="362" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="44" fill="#9fb0c4">°C</text>
  <!-- flame -->
  <!-- flame, tip up -->
  <path d="M372 474 C392 494 404 510 404 528 C404 546 390 558 372 558 C354 558 340 546 340 528 C340 516 346 506 354 500 C356 512 362 518 368 518 C364 504 364 490 372 474 Z" fill="#ff8a3d"/>
  <rect x="430" y="516" width="230" height="10" rx="5" fill="#3d4757"/>
  <rect x="430" y="516" width="150" height="10" rx="5" fill="#4aa3ff"/>
  <!-- buttons -->
  <circle cx="420" cy="690" r="54" fill="#f3f5f8" stroke="#cfd5dd" stroke-width="4"/>
  <rect x="396" y="686" width="48" height="8" rx="4" fill="#5b6574"/>
  <circle cx="580" cy="690" r="54" fill="#f3f5f8" stroke="#cfd5dd" stroke-width="4"/>
  <rect x="556" y="686" width="48" height="8" rx="4" fill="#5b6574"/>
  <rect x="576" y="666" width="8" height="48" rx="4" fill="#5b6574"/>
</svg>
