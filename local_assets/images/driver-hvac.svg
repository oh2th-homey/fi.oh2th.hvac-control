<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e3e7ed"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ced6"/><stop offset="1" stop-color="#a9b0bb"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#25303f"/><stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/><feOffset dx="18" dy="26"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1000" height="1000" fill="#ffffff"/>
  <g filter="url(#shadow)">
    <path d="M880 300 L912 324 L912 676 L880 700 Z" fill="url(#side)"/>
    <rect x="110" y="280" width="770" height="440" rx="54" fill="url(#body)" stroke="#d5dae1" stroke-width="4"/>
  </g>
  <rect x="160" y="326" width="670" height="348" rx="24" fill="url(#screen)"/>
  <!-- house with thermometer -->
  <path d="M220 470 L320 384 L420 470" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M244 450 V600 H396 V450" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="309" y="470" width="22" height="80" rx="11" fill="none" stroke="#ff8a3d" stroke-width="10"/>
  <circle cx="320" cy="566" r="20" fill="#ff8a3d"/>
  <!-- status -->
  <text x="470" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="58" font-weight="300" fill="#ffffff">21.0°</text>
  <circle cx="486" cy="462" r="10" fill="#5ad17a"/>
  <rect x="506" y="455" width="150" height="14" rx="7" fill="#5b6a80"/>
  <!-- price bars -->
  <g fill="#4aa3ff">
    <rect x="470" y="560" width="26" height="54" rx="4"/>
    <rect x="506" y="540" width="26" height="74" rx="4"/>
    <rect x="542" y="574" width="26" height="40" rx="4"/>
    <rect x="578" y="520" width="26" height="94" rx="4" fill="#ff8a3d"/>
    <rect x="614" y="556" width="26" height="58" rx="4"/>
    <rect x="650" y="580" width="26" height="34" rx="4"/>
    <rect x="686" y="566" width="26" height="48" rx="4"/>
    <rect x="722" y="586" width="26" height="28" rx="4"/>
  </g>
  <rect x="466" y="618" width="290" height="4" rx="2" fill="#5b6a80"/>
</svg>
